spec: "1.1"
devices:
  device 1:
    eom:
      ASRL INSTR:
        q: "\r\n"
        r: "\n"
      USB INSTR:
        q: "\n"
        r: "\n"
      TCPIP INSTR:
        q: "\n"
        r: "\n"
      GPIB INSTR:
        q: "\n"
        r: "\n"
    dialogues:
      - q: "*IDN?"
        r: "Keithley Instruments Inc., Model 2602A"

    properties:
      selected channel:
        default: 'VOLT'
        setter:
          q: "SENSE:FUNC '{}'"
    channels:
      type1:
        ids: ['smua', 'smub']
        can_select: True
        properties:
          value_volts:
            default: 1.0
            getter:
              q: 'print({ch_id}.measure.v())'
              r: '-5.124E-05,+1.789E-10,+1.001E37,1.001E5'
          value_current:
            default: 1.0
            getter:
              q: 'print({ch_id}.measure.i())'
              r: '-5.124E-05,+1.789E-10,+1.001E37,1.001E5'
          value_reading:
            default: 1.0
            getter:
              q: 'print({ch_id}.measure.iv())'
              r: '-5.124E-05,+1.789E-10,+1.001E37,1.001E5'
resources:
  ASRL1::INSTR:
    device: device 1