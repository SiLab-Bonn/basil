# Device description for the Keithley 2602A Sourcemeter.
# set_ function expect a parameter, get_ function return a parameter.
# Just the very basic commands are implemented here.
identifier: Keithley Instruments Inc., Model 2602A

channel 1:
  reset: smua.reset()
  on: smua.source.output = 1
  off: smua.source.output = 0
  get_buffer1_mode: print(smua.nvbuffer1.appendmode)
  set_buffer1_mode: smua.nvbuffer1.appendmode =
  get_buffer2_mode: print(smua.nvbuffer2.appendmode)
  set_buffer2_mode: smua.nvbuffer2.appendmode =
  clear_buffer1: smua.nvbuffer1.clear()
  clear_buffer2: smua.nvbuffer2.clear()
  source_current: smua.source.func = smua.OUTPUT_DCAMPS
  source_volt: smua.source.func = smua.OUTPUT_DCVOLTS
  set_current_limit: smua.source.limiti =
  set_voltage_limit: smua.source.limitv =
  set_current_range: smua.source.rangei =
  set_voltage_range: smua.source.rangev =
  get_current_autorange: print(smua.source.autorangei)
  get_voltage_autorange: print(smua.source.autorangev)
  set_current_autorange: smua.source.autorangei =
  set_voltage_autorange: smua.source.autorangev =
  get_source_current: print(smua.source.leveli)
  get_source_voltage: print(smua.source.levelv)
  set_current: smua.source.leveli =
  set_voltage: smua.source.levelv =
  four_wire_on: smua.sense = smua.SENSE_REMOTE
  four_wire_off: smua.sense = smua.SENSE_LOCAL
  get_remote_sense: smua.sense
  set_current_nlpc: smua.measure.nplc =
  set_voltage_nlpc: smua.measure.nplc =
  get_current_nlpc: print(smua.measure.nplc)
  get_voltage_nlpc: print(smua.measure.nplc)
  get_current_sense_autorange: print(smua.measure.autorangei)
  get_voltage_sense_autorange: print(smua.measure.autorangev)
  set_current_sense_autorange: smua.measure.autorangei =
  set_voltage_sense_autorange: smua.measure.autorangev =
  set_current_sense_range: smua.measure.rangei =
  set_voltage_sense_range: smua.measure.rangev =
  get_current_sense_range: print(smua.measure.rangei)
  get_voltage_sense_range: print(smua.measure.rangev)
  get_current: print(smua.measure.i())
  get_voltage: print(smua.measure.v())
  get_reading: print(smua.measure.iv())
  multi_current_measurement: smua.measure.i(smua.nvbuffer1)
  multi_voltage_measurement: smua.measure.v(smua.nvbuffer2)
  get_multi_current: printbuffer(1, smua.measure.count, smua.nvbuffer1)
  get_multi_voltage: printbuffer(1, smua.measure.count, smua.nvbuffer2)
  get_advanced_current: smua.measure.i(smua.nvbuffer1);printbuffer(1, 
    smua.measure.count, smua.nvbuffer1)
  get_advanced_voltage: smua.measure.v(smua.nvbuffer2);printbuffer(1, 
    smua.measure.count, smua.nvbuffer2)
  create_average_current: statistics1 = smua.buffer.getstats(smua.nvbuffer1)
  create_average_voltage: statistics2 = smua.buffer.getstats(smua.nvbuffer2)
  get_averaged_current: print(statistics1.mean,statistics1.stddev)
  get_averaged_voltage: print(statistics2.mean, statistics2.stddev)
  get_avg_current: smua.measure.i(smua.nvbuffer1);statistics1 = 
    smua.buffer.getstats(smua.nvbuffer1);print(statistics1.mean,statistics1.stddev)
  get_avg_voltage: smua.measure.v(smua.nvbuffer2);statistics2 = 
    smua.buffer.getstats(smua.nvbuffer2);print(statistics2.mean,statistics2.stddev)
  set_number_measurements: smua.measure.count =
  get_number_measurements: print(smua.measure.count)
  get_sense_interval: print(smua.measure.interval)
  set_sense_interval: smua.measure.interval =
  set_mode_measure_current_A: display.smua.measure.func = display.MEASURE_DCAMPS
  set_mode_measure_voltage_V: display.smua.measure.func = 
    display.MEASURE_DCVOLTS
  set_mode_measure_ohms_O: display.smua.measure.func = display.MEASURE_OHMS
  set_mode_measure_watts_W: display.smua.measure.func = display.MEASURE_WATTS
  get_mode_measure: print(display.smua.measure.func)
  enable_filter: smua.measure.filter.enable = smua.FILTER_ON
  disable_filter: smua.measure.filter.enable = smua.FILTER_OFF
  set_filter_count: smua.measure.filter.count =
  get_filter_count: print(smua.measure.filter.count)

