exclude: (?i)(^|/)sitcp(/|$)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
  - repo: local
    hooks:
      - id: coverage
        name: Coverage
        entry: >-
          bash -c 'SIM=icarus coverage run
          --source=basil -m pytest
          -q --disable-warnings
          tests/test_*.py examples/*/*/test_*.py
          && coverage xml -q -o coverage.xml
          && diff-cover coverage.xml
          --compare-branch=origin/master
          --show-uncovered'
        language: system
        pass_filenames: false
        verbose: true
        files: ^(basil/|tests/|examples/).*\.py$
        stages: [pre-commit]
      - id: verilator-lint
        name: verilator lint (Verilog-2005)
        entry: python tools/lint_verilog.py verilator
        language: python
        additional_dependencies: ["tomli==2.2.1; python_version < '3.11'"]
        pass_filenames: false
        files: '(\.(v|sv|f)$|^tools/|^pyproject\.toml$)'
      - id: slang-lint
        name: slang semantic lint
        entry: python tools/lint_verilog.py slang
        language: python
        # Pre-commit local environments cannot install extras from this checkout.
        # Keep aligned with project.optional-dependencies.hdl-lint.
        additional_dependencies: [pyslang==11.0.0, "tomli==2.2.1; python_version < '3.11'"]
        pass_filenames: false
        files: '(\.(v|sv|f)$|^tools/|^pyproject\.toml$)'
      - id: verible-format
        name: verible format
        entry: python tools/lint_verilog.py verible-format --fix
        language: python
        additional_dependencies: ["tomli==2.2.1; python_version < '3.11'"]
        types: [verilog]
        files: '\.(v|sv)$'
      - id: verible-lint
        name: verible style lint
        entry: python tools/lint_verilog.py verible-lint
        language: python
        additional_dependencies: ["tomli==2.2.1; python_version < '3.11'"]
        types: [verilog]
        files: '\.(v|sv)$'
