transfer_layer:
  - name: Serial
    type: Serial
    init:
      port: "/dev/ttyUSB0"
      read_termination: "\n"
      baudrate: 19200
      parity: "E"
      bytesize: 8
      rtscts: True
      exclusive: False



hw_drivers:
  - name: SMU
    type: scpi
    interface: Serial
    init:
      device: Keithley 2602a

