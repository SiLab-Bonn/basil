name: Regression tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  # Run Ruff's Python lint fixes and formatter, plus the end-of-file and
  # trailing-whitespace hooks, across all tracked files. Fail if a hook fails
  # or changes files. HDL checks are skipped here and reported separately below.
  pre-commit:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.3.0

      - name: Check python and repository hygiene
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: verible-format,verible-lint,verilator-lint,slang-lint  # Separate jobs run the four HDL checks.

  # Run each HDL check as its own job so failures are visible independently.
  # Use the same scripts and configuration as local pre-commit hooks, with
  # cached prebuilt native tools or the pyslang wheel rather than source builds.
  hdl:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:

          # Keeps indentation, spacing and line wrapping consistent.
          - name: verible-format
            check: verible-format
            install: verible

          # Checks source conventions such as naming, module filenames,
          # missing case defaults and risky constructs; formatting cannot catch these.
          - name: verible-lint
            check: verible-lint
            install: verible

          # Elaborates Verilog-2005 designs; catches implicit nets, width mismatches,
          # missing ports, multiple drivers and unintended latches.
          - name: verilator-lint
            check: verilator-lint
            install: oss-cad-suite

          # Independent elaboration catches name, type and parameter errors,
          # including issues Verilator may accept or diagnose differently.
          - name: slang-lint
            check: slang-lint
            install: slang
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache native HDL tools
        if: matrix.install != 'slang'
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            build/tools/verible
            build/tools/oss-cad-suite
          key: hdl-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}

      # Extract pinned prebuilt binaries; lint setup never builds tools from source.
      - name: Install native HDL tools
        if: matrix.install != 'slang' && steps.native-cache.outputs.cache-hit != 'true'
        run: |
          bash tools/install.sh

      - name: Add native HDL tool to PATH
        if: matrix.install != 'slang'
        run: echo "$PWD/build/tools/${{ matrix.install }}/bin" >> "$GITHUB_PATH"

      - name: Install slang python bindings
        if: matrix.install == 'slang'
        run: |
          mkdir -p build/tools
          python tools/sources.py requirements > build/tools/hdl-requirements.txt
          python -m pip install --only-binary=:all: -r build/tools/hdl-requirements.txt

      - name: Check HDL
        run: python tools/run.py "${{ matrix.check }}"

  # Run Python unit tests and Cocotb simulations through pytest with Icarus on
  # Python 3.10-3.14. Python 3.14 also runs the marked Verilator subset as a
  # separate matrix job. Only the full Python 3.14 Icarus run measures coverage.
  tests:
    name: ${{ matrix.sim }}-sim${{ matrix.coverage && '-coverage' || '' }} / python${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      SIM: ${{matrix.sim}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - sim: icarus
            python-version: '3.10'

          - sim: icarus
            python-version: '3.11'

          - sim: icarus
            python-version: '3.12'

          - sim: icarus
            python-version: '3.13'

          - sim: icarus
            python-version: '3.14'
            # Collect coverage only once, using the full test suite.
            coverage: true

          # Verilator runs only the marked simulation subset, so it cannot
          # provide coverage for the full suite.
          - sim: verilator
            python-version: '3.14'
            pytest-marker: '-m verilator'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.coverage && '0' || '1' }}

      - name: Set up python ${{matrix.python-version}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}

      - name: Cache icarus and verilator
        id: simulation-cache
        uses: actions/cache@v4
        with:
          path: |
            build/tools/verible
            build/tools/oss-cad-suite
          key: hdl-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}

      # OSS-CAD Suite provides the prebuilt Icarus Verilog and Verilator simulators.
      - name: Install icarus and verilator
        if: steps.simulation-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "tomli==2.2.1; python_version < '3.11'"
          bash tools/install.sh

      - name: Add icarus and verilator to PATH
        run: echo "$PWD/build/tools/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # Install Basil and its test extra: pytest, Cocotb simulation helpers,
      # PyVISA/pyvisa-sim instrument mocks, and coverage/diff-cover reporting.
      - name: Install python test deps
        run: |
          export PATH="$pythonLocation/bin:$PATH"
          python -m pip install -e '.[test]'

      - name: Run pytest
        env:
          COLLECT_COVERAGE: ${{ matrix.coverage || false }}
        run: |
          # Keep project Python and Cocotb ahead of the simulator bundle.
          export PATH="$pythonLocation/bin:$PATH"
          if [[ "$COLLECT_COVERAGE" == "true" ]]; then
            mkdir -p build/cov
            python -m coverage run --source=basil -m pytest \
              ${{ matrix.pytest-marker }} tests/test_*.py examples/*/*/test_*.py
          else
            python -m pytest ${{ matrix.pytest-marker }} tests/test_*.py examples/*/*/test_*.py
          fi

      - name: Generate and publish coverage reports
        if: matrix.coverage
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$pythonLocation/bin:$PATH"
          python -m coverage xml
          python -m coverage report --format=total | awk '{print "### Test coverage: " $1 "%"}' >> "$GITHUB_STEP_SUMMARY"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff-cover build/cov/coverage.xml \
              --compare-branch="origin/${BASE_REF}" \
              --format=markdown:build/cov/diff-cover.md
            cat build/cov/diff-cover.md >> "$GITHUB_STEP_SUMMARY"

            # Fork PRs receive the job summary without a check requiring write access.
            if [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
              gh api --method POST \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/check-runs" \
                --raw-field name="Coverage (informational)" \
                --raw-field head_sha="$HEAD_SHA" \
                --raw-field status=completed \
                --raw-field conclusion=neutral \
                --raw-field "output[title]=Differential coverage" \
                --field "output[summary]=@build/cov/diff-cover.md" \
                --silent || echo "::warning::Could not publish the informational coverage check"
            fi
          fi
