name: Regression Tests

on:
  push:
    branches:
    - master
  pull_request:

permissions:
  contents: read

jobs:

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install pre-commit
      run: python -m pip install pre-commit==4.3.0
    - name: Check Python and repository hygiene
      run: pre-commit run --all-files --show-diff-on-failure
      env:
        SKIP: verible-format,verible-lint,verilator-lint,slang-lint # Separate jobs run the four HDL checks.

  hdl:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keeps indentation, spacing and line wrapping consistent.
          - name: verible-format
            check: verible-format
            install: verible
          # Checks source conventions such as naming, module filenames,
          # unused declarations and confusing constructs; formatting cannot catch these.
          - name: verible-lint
            check: verible-lint
            install: verible
          # Elaborates Verilog-2005 designs; catches implicit nets, width mismatches,
          # missing ports, multiple drivers and unintended latches.
          - name: verilator-lint
            check: verilator-lint
            install: oss-cad-suite
          # Independent elaboration catches name, type and parameter errors,
          # including issues Verilator may accept or diagnose differently.
          - name: slang-lint
            check: slang-lint
            install: slang
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Cache native HDL tool
      if: matrix.install != 'slang'
      id: native-cache
      uses: actions/cache@v4
      with:
        path: build/tools/${{ matrix.install }}
        key: hdl-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.install }}-${{ hashFiles('pyproject.toml') }}
    # Extract pinned prebuilt binaries; lint setup never builds tools from source.
    - name: Install native HDL tool
      if: matrix.install != 'slang' && steps.native-cache.outputs.cache-hit != 'true'
      run: |
        bash tools/install.sh "${{ matrix.install }}" "$PWD/build/tools/${{ matrix.install }}"
    - name: Add native HDL tool to PATH
      if: matrix.install != 'slang'
      run: echo "$PWD/build/tools/${{ matrix.install }}/bin" >> "$GITHUB_PATH"
    - name: Install Slang Python bindings
      if: matrix.install == 'slang'
      run: |
        mkdir -p build/tools
        python tools/sources.py requirements > build/tools/hdl-requirements.txt
        python -m pip install --only-binary=:all: -r build/tools/hdl-requirements.txt
    - name: Check HDL
      run: python tools/run.py "${{ matrix.check }}"

  tests:

    name: Python ${{matrix.python-version}} | ${{matrix.sim}}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    env:
      SIM: ${{matrix.sim}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - sim: icarus
            python-version: '3.10'

          - sim: icarus
            python-version: '3.11'

          - sim: icarus
            python-version: '3.12'

          - sim: icarus
            python-version: '3.13'
            coverage: true

          - sim: verilator
            python-version: '3.12'
            pytest-marker: "-m verilator"

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: ${{ matrix.coverage && '0' || '1' }}
    - name: Set up miniforge ${{matrix.python-version}}
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        python-version: ${{matrix.python-version}}
        conda-remove-defaults: "true" # explicitly remove conda default channel in favor of conda-forge

    - name: Cache native simulation tools
      id: simulation-cache
      uses: actions/cache@v4
      with:
        path: build/tools/oss-cad-suite
        key: hdl-v3-${{ runner.os }}-${{ runner.arch }}-oss-cad-suite-${{ hashFiles('pyproject.toml') }}
    - name: Install native simulation tools
      if: steps.simulation-cache.outputs.cache-hit != 'true'
      shell: bash -l {0}
      run: |
        python -m pip install "tomli==2.2.1; python_version < '3.11'"
        bash tools/install.sh oss-cad-suite "$PWD/build/tools/oss-cad-suite"
    - name: Add native simulation tools to PATH
      run: echo "$PWD/build/tools/oss-cad-suite/bin" >> "$GITHUB_PATH"

    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e .[test]

    - name: Test
      if: ${{ !matrix.coverage }}
      shell: bash -l {0}
      run: |
        export PATH="$CONDA_PREFIX/bin:$PATH"
        pytest ${{matrix.pytest-marker}} tests/test_*.py examples/*/*/test_*.py

    - name: Test with coverage
      if: matrix.coverage
      shell: bash -l {0}
      run: |
        export PATH="$CONDA_PREFIX/bin:$PATH"
        mkdir -p build/cov
        coverage run --source=basil -m pytest ${{matrix.pytest-marker}} \
          tests/test_*.py examples/*/*/test_*.py
        coverage xml
        coverage report --format=total | awk '{print "### Test coverage: " $1 "%"}' >> "$GITHUB_STEP_SUMMARY"

    - name: Create differential coverage report
      if: matrix.coverage && github.event_name == 'pull_request'
      env:
        BASE_REF: ${{github.base_ref}}
      shell: bash -l {0}
      run: |
        diff-cover build/cov/coverage.xml \
          --compare-branch="origin/${BASE_REF}" \
          --format=markdown:build/cov/diff-cover.md
        cat build/cov/diff-cover.md >> "$GITHUB_STEP_SUMMARY"

    - name: Publish differential coverage check
      if: >-
        matrix.coverage &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      env:
        GH_TOKEN: ${{github.token}}
        HEAD_SHA: ${{github.event.pull_request.head.sha}}
      run: |
        gh api --method POST \
          --header "Accept: application/vnd.github+json" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "repos/${GITHUB_REPOSITORY}/check-runs" \
          --raw-field name="Coverage (informational)" \
          --raw-field head_sha="$HEAD_SHA" \
          --raw-field status=completed \
          --raw-field conclusion=neutral \
          --raw-field "output[title]=Differential coverage" \
          --field "output[summary]=@build/cov/diff-cover.md" \
          --silent
