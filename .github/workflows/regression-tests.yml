name: Regression Tests

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: pre-commit/action@v3.0.1

  tests:

    name: Python ${{matrix.python-version}} | ${{matrix.sim}}
    runs-on: ubuntu-24.04
    env:
      SIM: ${{matrix.sim}}

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - sim: icarus
            python-version: '3.10'

          - sim: icarus
            python-version: '3.11'

          - sim: icarus
            python-version: '3.12'

          - sim: icarus
            python-version: '3.13'
            coverage: true

          - sim: verilator
            sim-version: 5.044
            python-version: '3.10'
            pytest-marker: "-m verilator"

    steps:
    - uses: actions/checkout@v6
    - name: Set up miniforge ${{matrix.python-version}}
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        python-version: ${{matrix.python-version}}
        conda-remove-defaults: "true" # explicitly remove conda default channel in favor of conda-forge

    - name: Install verilator
      if: matrix.sim == 'verilator'
      shell: bash -l {0}
      run: |
        conda install verilator==${{matrix.sim-version}}

    - name: Install Icarus Verilog
      if: matrix.sim == 'icarus'
      run: |
        sudo apt install -y --no-install-recommends iverilog

    - name: Install Python dependencies
      shell: bash -l {0}
      run: |
        pip install pyvisa pyvisa-sim pytest cocotb>=2 cocotb-bus

    - name: Install coverage dependency
      if: matrix.coverage
      shell: bash -l {0}
      run: |
        pip install pytest-cov

    - name: Install basil
      shell: bash -l {0}
      run: |
        pip install -e .

    - name: Test
      if: ${{ !matrix.coverage }}
      shell: bash -l {0}
      run: |
        pytest ${{matrix.pytest-marker}} tests/test_*.py examples/*/*/test_*.py

    - name: Test with coverage
      if: matrix.coverage
      shell: bash -l {0}
      run: |
        pytest ${{matrix.pytest-marker}} --cov=basil tests/test_*.py examples/*/*/test_*.py
        coverage report --format=total | awk '{print "### Test coverage: " $1 "%"}' >> "$GITHUB_STEP_SUMMARY"
