name: Regression Tests

on:
  push:
    branches:
    - master
  pull_request:

permissions:
  contents: read

jobs:

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install pre-commit
      run: python -m pip install pre-commit==4.3.0
    - name: Check Python and repository hygiene
      run: pre-commit run --all-files --show-diff-on-failure
      env:
        SKIP: coverage,verible-format,verible-lint,verilator-lint,slang-lint # Separate jobs run HDL checks and coverage.

  hdl:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Verible formatting
            check: verible-format
            install: verible
          - name: Verible style lint
            check: verible-lint
            install: verible
          - name: Verilator lint (Verilog-2005)
            check: verilator
            install: verilator
          - name: Slang semantic lint
            check: slang
            install: slang
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install Verilator build dependencies
      if: matrix.install == 'verilator'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf bison flex g++ help2man make perl libfl-dev zlib1g-dev
    - name: Install native HDL tool
      if: matrix.install != 'slang'
      run: |
        bash tools/install_hdl_tools.sh "${{ matrix.install }}" "$PWD/build/hdl-tools"
        echo "$PWD/build/hdl-tools/bin" >> "$GITHUB_PATH"
    - name: Install Slang Python bindings
      if: matrix.install == 'slang'
      run: |
        python tools/hdl_config.py requirements > "$RUNNER_TEMP/hdl-requirements.txt"
        python -m pip install -r "$RUNNER_TEMP/hdl-requirements.txt"
    - name: Check HDL
      run: python tools/lint_verilog.py "${{ matrix.check }}"

  tests:

    name: Python ${{matrix.python-version}} | ${{matrix.sim}}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    env:
      SIM: ${{matrix.sim}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - sim: icarus
            python-version: '3.10'

          - sim: icarus
            python-version: '3.11'

          - sim: icarus
            python-version: '3.12'

          - sim: icarus
            python-version: '3.13'
            coverage: true

          - sim: verilator
            sim-version: 5.044
            python-version: '3.10'
            pytest-marker: "-m verilator"

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: ${{ matrix.coverage && '0' || '1' }}
    - name: Set up miniforge ${{matrix.python-version}}
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        python-version: ${{matrix.python-version}}
        conda-remove-defaults: "true" # explicitly remove conda default channel in favor of conda-forge

    - name: Install verilator
      if: matrix.sim == 'verilator'
      shell: bash -l {0}
      run: |
        conda install verilator==${{matrix.sim-version}}

    - name: Install Icarus Verilog
      if: matrix.sim == 'icarus'
      run: |
        sudo apt install -y --no-install-recommends iverilog

    - name: Install package
      shell: bash -l {0}
      run: |
        pip install -e .[test]

    - name: Test
      if: ${{ !matrix.coverage }}
      shell: bash -l {0}
      run: |
        pytest ${{matrix.pytest-marker}} tests/test_*.py examples/*/*/test_*.py

    - name: Test with coverage
      if: matrix.coverage
      shell: bash -l {0}
      run: |
        coverage run --source=basil -m pytest ${{matrix.pytest-marker}} \
          tests/test_*.py examples/*/*/test_*.py
        coverage xml -o coverage.xml
        coverage report --format=total | awk '{print "### Test coverage: " $1 "%"}' >> "$GITHUB_STEP_SUMMARY"

    - name: Create differential coverage report
      if: matrix.coverage && github.event_name == 'pull_request'
      env:
        BASE_REF: ${{github.base_ref}}
      shell: bash -l {0}
      run: |
        diff-cover coverage.xml \
          --compare-branch="origin/${BASE_REF}" \
          --format=markdown:diff-cover.md
        cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"

    - name: Publish differential coverage check
      if: >-
        matrix.coverage &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      env:
        GH_TOKEN: ${{github.token}}
        HEAD_SHA: ${{github.event.pull_request.head.sha}}
      run: |
        gh api --method POST \
          --header "Accept: application/vnd.github+json" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "repos/${GITHUB_REPOSITORY}/check-runs" \
          --raw-field name="Coverage (informational)" \
          --raw-field head_sha="$HEAD_SHA" \
          --raw-field status=completed \
          --raw-field conclusion=neutral \
          --raw-field "output[title]=Differential coverage" \
          --field "output[summary]=@diff-cover.md" \
          --silent
