[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools >= 61.0",
]

[project]
authors = [
    {name = "Tomasz Hemperek", email="hemperek@uni-bonn.de"},
    {name = "Jens Janssen", email="janssen@physik.uni-bonn.de"},
    {name = "David-Leon Pohl", email="pohl@physik.uni-bonn.de"}
]
dependencies = [
    "GitPython",
    "bitarray>=3.4.0",
    "numpy",
    "pyyaml",
    "ruamel.yaml",
    # TODO: Replace six compatibility imports with Python 3 built-ins and remove this dependency.
    "six",
]
description = "Basil is a modular data acquisition system and system testing framework in Python.\nIt also provides generic FPGA firmware modules for different hardware platforms and drivers for wide range of lab appliances."
dynamic = [
    "version",
]
maintainers = [
  {name = "Yannick Dieter", email = "dieter@physik.uni-bonn.de"},
  {name = "Christian Bespin", email = "bespin@physik.uni-bonn.de"},
]
name = "basil_daq"
readme = "README.md"
requires-python = ">=3.10,<3.15"

[project.license]
text = "BSD 3-Clause ('BSD New' or 'BSD Simplified') License"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-book-theme",
]
# We also depend on verible and verilator; see tools/install.sh
hdl-lint = [
    "pyslang==12.0.0; python_version >= '3.11'",
    # TOML parsing fallback until Python 3.10 reaches EOL; Python 3.11+ provides tomllib.
    "tomli==2.2.1; python_version < '3.11'",
]
hw = [
    "PyVISA",
    "pyserial",
]
test = [
    "PyVISA",
    "cocotb-bus>=0.3.0",
    "cocotb-test>=0.2.6",
    # Cocotb 2.1 adds support for Python 3.14.
    "cocotb>=2.1.0",
    "coverage[toml]",
    "diff-cover",
    "pytest>=9.0.3",
    "pyvisa-sim",
]

[project.urls]
Documentation = "https://basil.readthedocs.io/en/latest/"
Repository = "https://github.com/SiLab-Bonn/basil/"

[sources.hdl]
# Repository scripts translate these settings into native HDL tool arguments.
include-directories = [
    "basil/firmware/modules",
    "basil/firmware/modules/utils",
    "basil/firmware/modules/includes",
]
library-directories = [
    "basil/firmware/modules/utils",
    "basil/firmware/modules/bram_fifo",
    "basil/firmware/modules/cmd_seq",
    "basil/firmware/modules/fast_spi_rx",
    "basil/firmware/modules/fei4_rx",
    "basil/firmware/modules/fx3_if",
    "basil/firmware/modules/gpac_adc_rx",
    "basil/firmware/modules/gpio",
    "basil/firmware/modules/i2c",
    "basil/firmware/modules/includes",
    "basil/firmware/modules/jtag_master",
    "basil/firmware/modules/m26_rx",
    "basil/firmware/modules/pulse_gen",
    "basil/firmware/modules/rrp_arbiter",
    "basil/firmware/modules/seq_gen",
    "basil/firmware/modules/seq_rec",
    "basil/firmware/modules/spi",
    "basil/firmware/modules/sram_fifo",
    "basil/firmware/modules/tb",
    "basil/firmware/modules/tdc_s3",
    "basil/firmware/modules/tdl_tdc",
    "basil/firmware/modules/tdl_tdc/counter",
    "basil/firmware/modules/tdl_tdc/delayline",
    "basil/firmware/modules/tdl_tdc/utils",
    "basil/firmware/modules/timestamp",
    "basil/firmware/modules/tlu",
    "basil/firmware/modules/uart",
]
source-suffixes = [
    ".v",
    ".sv",
]
systemverilog-standard = "1800-2017"
vendor-directories = [
    "sitcp",
]
verilog-standard = "1364-2005"

[tool.verible.install]
version = "v0.0-4296-g0f262651"
sha256 = "8569defb891d2316067613ea00442af28a7a09d405d95b54c0c91f9942d26635"
url = "https://github.com/chipsalliance/verible/releases/download/{version}/verible-{version}-linux-static-x86_64.tar.gz"

[tool.oss-cad-suite.install]
version = "2026-10-01"
sha256 = "1c91249e9671666b58d94e2fe8a81e6103d37b254eab77bd82625802c208bf4d"
url = "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/{version}/oss-cad-suite-linux-x64-{date}.tgz"

[tool.pytest.ini_options]
addopts = ["--basetemp=build/sim/pytest", "--junitxml=build/tests/results.xml"]
cache_dir = "build/tests/pytest-cache"
log_file = "build/log/pytest.log"
markers = [
    "verilator: Verilog tests.",
]

[tool.coverage.run]
data_file = "build/cov/.coverage"

[tool.coverage.xml]
output = "build/cov/coverage.xml"

[tool.coverage.html]
directory = "build/cov/html"

[tool.coverage.json]
output = "build/cov/coverage.json"

[tool.coverage.lcov]
output = "build/cov/coverage.lcov"

[tool.ruff]
cache-dir = "build/tests/ruff-cache"
# Set the maximum line length to 120.
line-length = 120

[tool.ruff.lint]
# Keep the existing checks explicit across Ruff default-rule changes.
# TODO: Remove this explicit selection when we are ready to enforce the additional default lint rules.
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "I",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic.version]
attr = "basil.__version__"

[tool.slang]
args = [
    "-Wextra",
    "--timescale=1ns/1ps",
    "--allow-lib-module-redef",
    "-Wempty-output-connection",
]

[tool.uv.sources.cocotb-test]
git = "https://github.com/themperek/cocotb-test.git"
rev = "4e6b7db"

[tool.verible-format]
args = [
    "--assignment_statement_alignment=align",
    "--class_member_variable_alignment=align",
    "--distribution_items_alignment=align",
    "--enum_assignment_statement_alignment=align",
    "--expand_coverpoints=true",
    "--formal_parameters_alignment=align",
    "--formal_parameters_indentation=indent",
    "--module_net_variable_alignment=flush-left",
    "--named_parameter_alignment=align",
    "--named_parameter_indentation=indent",
    "--named_port_alignment=align",
    "--named_port_indentation=indent",
    "--port_declarations_alignment=align",
    "--port_declarations_indentation=indent",
    "--port_declarations_right_align_packed_dimensions=true",
    "--port_declarations_right_align_unpacked_dimensions=true",
    "--struct_union_members_alignment=align",
    "--indentation_spaces=4",
    "--failsafe_success=false",
]

[tool.verible-lint]
# The disabled rules conflict with the Verilog-2005 dialect.
rules = [
    "-always-comb",
    "-explicit-parameter-storage-type",
    "-unpacked-dimensions-range-ordering",
    "parameter-name-style=localparam_style:CamelCase|ALL_CAPS",
]

[tool.verilator]
# Report legacy warnings; fail on implicit nets, syntax and elaboration errors.
args = [
    "--lint-only",
    "--timing",
    "-Wall",
    "-Wno-fatal",
    "-Werror-IMPLICIT",
]
